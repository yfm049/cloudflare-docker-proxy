name = "docker_proxy"
compatibility_date = "2025-01-01"

[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[env.vars]
CUSTOM_DOMAIN = "jdconveyor.com"

[env.dev.vars]
MODE = "debug"
TARGET_UPSTREAM = "https://registry-1.docker.io"

[env.production]
name = "docker_proxy"


[env.production.vars]
MODE = "production"
TARGET_UPSTREAM = ""

[env.staging]
name = "docker_proxy"

[env.staging.vars]
MODE = "staging"
TARGET_UPSTREAM = ""
